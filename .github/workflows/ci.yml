name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    name: Build, test, and security gate
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Check out repository
        uses: actions/checkout@v7
      - name: Set up Node.js
        uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm
      - name: Install locked dependencies
        run: npm ci
      - name: Run unit tests
        run: npm test
      - name: Run ESLint
        run: npm run lint
      - name: Run TypeScript check
        run: npm run typecheck
      - name: Audit production dependencies
        run: npm audit --omit=dev --audit-level=high
      - name: Build production site
        run: npm run build

  image-baseline:
    name: Approved-image uniqueness baseline (observational)
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Check out repository
        uses: actions/checkout@v7
      - name: Set up Node.js
        uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm
      - name: Install locked dependencies
        run: npm ci
      - name: Run approved-image uniqueness baseline
        continue-on-error: true
        run: npm run audit:heroes
